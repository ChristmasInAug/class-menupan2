<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴판 관리자</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="admin">
  <header class="admin__header">
    <div class="admin__eyebrow">MENU BOARD ADMIN</div>
    <h1 class="admin__title">메뉴판 설정</h1>
  </header>

  <section id="login-view" class="panel" hidden>
    <form id="login-form" class="login-form">
      <label class="field">
        <span class="field__label">아이디</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field__label">비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="button button--primary">로그인</button>
    </form>
  </section>

  <section id="settings-view" class="panel" hidden>
    <form id="settings-form">
      <div class="group">
        <div class="group__label">테마</div>
        <div id="theme-options" class="option-grid"></div>
      </div>

      <div class="group">
        <div class="group__label">디바이스</div>
        <div id="device-options" class="option-grid"></div>
      </div>

      <div class="group">
        <label class="field">
          <span class="field__label">매장명</span>
          <input type="text" name="매장명" required>
        </label>
        <label class="field">
          <span class="field__label">영문 태그</span>
          <input type="text" name="영문태그">
        </label>
        <label class="field">
          <span class="field__label">자동전환초 (0 = 수동)</span>
          <input type="number" name="자동전환초" min="0" step="1" required>
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="button button--primary">저장</button>
        <button type="button" id="logout-button" class="button">로그아웃</button>
      </div>
      <p id="save-status" class="status" hidden></p>
    </form>
  </section>
</main>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
